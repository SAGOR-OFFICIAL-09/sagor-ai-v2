<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SAGOR AI — তোমার নিজের AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ SAGOR AI — premium dark theme ============ */
:root{
  --bg:#070b16; --bg2:#0b1120; --panel:#0e1526; --panel2:#111a2e;
  --border:rgba(148,163,184,.12); --text:#e8eefc; --muted:#8b98b8;
  --cyan:#22d3ee; --violet:#8b5cf6; --accent:linear-gradient(135deg,#22d3ee,#8b5cf6);
  --user-bubble:linear-gradient(135deg,#0ea5b7,#6d5df6);
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Hind Siliguri','Inter',system-ui,sans-serif;
  background:radial-gradient(1200px 800px at 80% -10%,rgba(139,92,246,.12),transparent 60%),
             radial-gradient(1000px 700px at 10% 110%,rgba(34,211,238,.08),transparent 60%),var(--bg);
  color:var(--text); overflow:hidden;
}
#app{display:flex;height:100dvh}

/* ---------- Sidebar ---------- */
#sidebar{
  width:290px;min-width:290px;background:rgba(11,17,32,.85);backdrop-filter:blur(12px);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  transition:transform .28s ease;z-index:50;
}
#sidebar .brand{padding:18px 16px 12px;display:flex;align-items:center;gap:10px}
.logo-mark{
  width:40px;height:40px;border-radius:12px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;
  box-shadow:0 4px 18px rgba(139,92,246,.45);font-family:'Inter',sans-serif;
}
.brand h1{font-size:19px;font-weight:700;letter-spacing:.5px;font-family:'Inter',sans-serif}
.brand h1 span{background:var(--accent);-webkit-background-clip:text;background-clip:text;color:transparent}
#newChatBtn{
  margin:4px 14px 12px;padding:11px;border:1px solid var(--border);border-radius:12px;
  background:var(--panel2);color:var(--text);font-family:inherit;font-size:15px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s;
}
#newChatBtn:hover{border-color:var(--cyan);box-shadow:0 0 14px rgba(34,211,238,.25)}
#chatList{flex:1;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:4px}
.chat-item{
  padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:8px;
  color:var(--muted);font-size:14.5px;transition:.15s;border:1px solid transparent;
}
.chat-item:hover{background:rgba(148,163,184,.07);color:var(--text)}
.chat-item.active{background:rgba(139,92,246,.14);border-color:rgba(139,92,246,.35);color:var(--text)}
.chat-item .title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:6px;display:none}
.chat-item:hover .del{display:block}
.chat-item .del:hover{color:#f87171;background:rgba(248,113,113,.12)}
.chat-item input{background:var(--bg);border:1px solid var(--cyan);color:var(--text);border-radius:6px;padding:2px 6px;font-family:inherit;font-size:14px;width:100%}
.sidebar-foot{padding:12px 14px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399}

/* ---------- Main ---------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#topbar{
  display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);
  background:rgba(7,11,22,.7);backdrop-filter:blur(10px);z-index:20;
}
#hamburger{display:none;background:none;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 11px;font-size:17px;cursor:pointer}
#topbar .t-logo{font-family:'Inter',sans-serif;font-weight:800;font-size:16px;letter-spacing:.5px}
#topbar .t-logo span{background:var(--accent);-webkit-background-clip:text;background-clip:text;color:transparent}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.icon-btn{
  background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:10px;
  padding:8px 10px;cursor:pointer;font-size:15px;transition:.2s;font-family:inherit;
  display:flex;align-items:center;gap:6px;
}
.icon-btn:hover{color:var(--text);border-color:var(--cyan)}
.icon-btn.on{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px rgba(34,211,238,.25)}
.icon-btn.danger:hover{color:#f87171;border-color:#f87171}

/* ---------- Welcome ---------- */
#welcome{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center}
#welcome.hidden{display:none}
.w-logo{
  width:92px;height:92px;border-radius:26px;background:var(--accent);display:flex;align-items:center;justify-content:center;
  font-family:'Inter',sans-serif;font-weight:800;font-size:34px;color:#fff;margin-bottom:20px;
  box-shadow:0 10px 40px rgba(139,92,246,.5);animation:float 4s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#welcome h2{font-size:clamp(30px,5vw,46px);font-weight:700;margin-bottom:8px;font-family:'Inter','Hind Siliguri',sans-serif}
#welcome h2 span{background:var(--accent);-webkit-background-clip:text;background-clip:text;color:transparent}
#welcome p.tag{color:var(--muted);font-size:17px;margin-bottom:30px;max-width:520px;line-height:1.7}
#promptCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;max-width:760px;width:100%}
.pcard{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;
  cursor:pointer;text-align:left;transition:.2s;color:var(--text);font-family:inherit;
}
.pcard:hover{transform:translateY(-3px);border-color:var(--violet);box-shadow:0 8px 24px rgba(139,92,246,.25)}
.pcard .ico{font-size:24px;margin-bottom:10px}
.pcard .t{font-weight:600;font-size:15.5px;margin-bottom:4px}
.pcard .d{color:var(--muted);font-size:13.5px}

/* ---------- Messages ---------- */
#messages{flex:1;overflow-y:auto;padding:22px 16px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
#messages.hidden{display:none}
.msg-wrap{max-width:820px;width:100%;margin:0 auto;display:flex;gap:10px;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg-wrap.user{flex-direction:row-reverse}
.avatar{
  width:36px;height:36px;min-width:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:700;
}
.avatar.ai{background:var(--accent);color:#fff;box-shadow:0 3px 12px rgba(139,92,246,.4);font-family:'Inter',sans-serif;font-size:14px}
.avatar.you{background:#1e293b;color:var(--cyan);border:1px solid var(--border)}
.bubble{
  max-width:min(78%,640px);padding:13px 16px;border-radius:var(--radius);font-size:15.5px;line-height:1.75;
  word-wrap:break-word;overflow-wrap:anywhere;position:relative;
}
.msg-wrap.user .bubble{background:var(--user-bubble);color:#fff;border-bottom-right-radius:6px;box-shadow:0 4px 16px rgba(14,165,183,.25)}
.msg-wrap.ai .bubble{background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:6px}
.bubble p{margin:0 0 8px}.bubble p:last-child{margin-bottom:0}
.bubble ul,.bubble ol{margin:6px 0 10px 20px}
.bubble li{margin-bottom:4px}
.bubble strong{color:#fff}
.bubble code{background:rgba(34,211,238,.12);color:var(--cyan);padding:2px 7px;border-radius:6px;font-family:ui-monospace,monospace;font-size:13.5px}
.bubble pre{
  background:#060a14;border:1px solid var(--border);border-radius:12px;padding:0;margin:10px 0;overflow:hidden;
}
.bubble pre .code-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.bubble pre code{display:block;padding:12px 14px;background:none;color:#c9d6f2;overflow-x:auto;font-size:13.5px;line-height:1.6}
.copy-btn{background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.3);color:var(--cyan);border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer;font-family:inherit}
.copy-btn:hover{background:rgba(34,211,238,.25)}
.msg-actions{display:flex;gap:6px;margin-top:8px}
.mini-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:4px 9px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
.mini-btn:hover{color:var(--cyan);border-color:var(--cyan)}
.mini-btn.speaking{color:var(--cyan);border-color:var(--cyan)}
/* typing dots */
.typing{display:inline-flex;gap:5px;padding:6px 2px}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--cyan);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:scale(.8)}30%{opacity:1;transform:scale(1.15)}}

/* ---------- Input bar ---------- */
#inputBar{padding:14px 16px 18px;background:linear-gradient(transparent,rgba(7,11,22,.9) 30%)}
#inputInner{max-width:820px;margin:0 auto}
#stopRow{display:none;justify-content:center;margin-bottom:10px}
#stopRow.show{display:flex}
#stopBtn{
  background:rgba(248,113,113,.14);border:1px solid rgba(248,113,113,.5);color:#f87171;border-radius:24px;
  padding:8px 22px;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;
}
#chatForm{
  display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1px solid var(--border);
  border-radius:20px;padding:8px 8px 8px 16px;transition:.2s;
}
#chatForm:focus-within{border-color:var(--violet);box-shadow:0 0 18px rgba(139,92,246,.25)}
#userInput{
  flex:1;background:none;border:none;outline:none;color:var(--text);font-family:inherit;font-size:16px;
  resize:none;max-height:150px;line-height:1.6;padding:8px 0;
}
#userInput::placeholder{color:var(--muted)}
.round-btn{
  width:44px;height:44px;min-width:44px;border-radius:50%;border:none;cursor:pointer;font-size:18px;
  display:flex;align-items:center;justify-content:center;transition:.2s;
}
#micBtn{background:var(--panel2);border:1px solid var(--border);color:var(--muted)}
#micBtn:hover{color:var(--cyan);border-color:var(--cyan)}
#micBtn.listening{background:rgba(248,113,113,.15);border-color:#f87171;color:#f87171;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.4)}50%{box-shadow:0 0 0 8px rgba(248,113,113,0)}}
#sendBtn{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(139,92,246,.4)}
#sendBtn:hover{transform:scale(1.06)}
#sendBtn:disabled{opacity:.4;cursor:default;transform:none}
.hint{text-align:center;color:var(--muted);font-size:12.5px;margin-top:8px}

/* ---------- Mobile ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
#scrim.show{display:block}
@media (max-width:768px){
  #sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-105%);box-shadow:20px 0 50px rgba(0,0,0,.5)}
  #sidebar.open{transform:none}
  #hamburger{display:block}
  .bubble{max-width:88%}
  .icon-btn .lbl{display:none}
  #promptCards{grid-template-columns:1fr 1fr}
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#26314d;border-radius:8px}
</style>
</head>
<body>
<div id="app">
  <!-- ======= Sidebar ======= -->
  <aside id="sidebar">
    <div class="brand"><div class="logo-mark">S</div><h1>SAGOR <span>AI</span></h1></div>
    <button id="newChatBtn">＋ নতুন চ্যাট</button>
    <div id="chatList"></div>
    <div class="sidebar-foot"><span class="dot"></span> SAGOR AI • v2.0 • তোমার নিজের AI</div>
  </aside>
  <div id="scrim"></div>

  <!-- ======= Main ======= -->
  <main id="main">
    <div id="topbar">
      <button id="hamburger" title="মেনু">☰</button>
      <div class="t-logo">SAGOR <span>AI</span></div>
      <div class="top-actions">
        <button id="speakToggle" class="icon-btn" title="ভয়েস উত্তর চালু/বন্ধ">🔈 <span class="lbl">ভয়েস</span></button>
        <button id="exportBtn" class="icon-btn" title="চ্যাট ডাউনলোড (.txt)">⤓ <span class="lbl">সেভ</span></button>
        <button id="clearBtn" class="icon-btn danger" title="চ্যাট মুছে ফেলো">🗑 <span class="lbl">মুছো</span></button>
      </div>
    </div>

    <!-- Welcome screen -->
    <div id="welcome">
      <div class="w-logo">S</div>
      <h2>SAGOR <span>AI</span></h2>
      <p class="tag">তোমার নিজের AI সহকারী — বাংলায় প্রশ্ন করো, গল্প শোনো, পড়াশোনা করো, মজা করো। যেকোনো কিছু জিজ্ঞেস করো! ✨</p>
      <div id="promptCards">
        <button class="pcard" data-q="আমাকে একটা ছোট মজার গল্প লেখো"><div class="ico">📖</div><div class="t">গল্প শোনাও</div><div class="d">একটা ছোট মজার গল্প লেখো</div></button>
        <button class="pcard" data-q="আমাকে সহজ ভাষায় অংক শেখাও, একটা উদাহরণ দাও"><div class="ico">🔢</div><div class="t">অংক শেখাও</div><div class="d">সহজ ভাষায় অংক বোঝাও</div></button>
        <button class="pcard" data-q="আমাকে English শেখাও, ৫টা নতুন word অর্থসহ দাও"><div class="ico">🔤</div><div class="t">English শেখাও</div><div class="d">নতুন word অর্থসহ শেখো</div></button>
        <button class="pcard" data-q="আমাকে একটা মজার জোকস বলো"><div class="ico">😂</div><div class="t">জোকস বলো</div><div class="d">হাসির জোকস শোনো</div></button>
      </div>
    </div>

    <!-- Messages -->
    <div id="messages" class="hidden"></div>

    <!-- Input -->
    <div id="inputBar">
      <div id="inputInner">
        <div id="stopRow"><button id="stopBtn">⏹ থামাও</button></div>
        <form id="chatForm">
          <textarea id="userInput" rows="1" placeholder="SAGOR AI-কে কিছু জিজ্ঞেস করো…"></textarea>
          <button type="button" id="micBtn" class="round-btn" title="ভয়েসে বলো">🎤</button>
          <button type="submit" id="sendBtn" class="round-btn" title="পাঠাও">➤</button>
        </form>
        <div class="hint">SAGOR AI ভুল করতে পারে — গুরুত্বপূর্ণ তথ্য যাচাই করে নিও</div>
      </div>
    </div>
  </main>
</div>
<script>
/* ================= SAGOR AI — app logic ================= */
'use strict';

// ---------- Config ----------
// ONLY the user's own SAGOR API — no third-party fallbacks.
const API_PRIMARY = 'https://api-sagor.vercel.app/api/chat?q=';
const TIMEOUT_MS = 25000;
const LS_KEY = 'sagor_ai_chats_v2';
const LS_SPEAK = 'sagor_ai_speak';

// ---------- State ----------
let chats = [];            // [{id,title,messages:[{role,text,ts}],createdAt}]
let activeId = null;
let typing = false;        // typewriter running?
let stopTyping = false;
let aborter = null;
let speakOn = localStorage.getItem(LS_SPEAK) === '1';

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const sidebar=$('sidebar'), scrim=$('scrim'), chatList=$('chatList'),
  welcome=$('welcome'), messages=$('messages'), chatForm=$('chatForm'),
  userInput=$('userInput'), sendBtn=$('sendBtn'), stopRow=$('stopRow');

// ---------- Storage ----------
function saveChats(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(chats)); }catch(e){} }
function loadChats(){
  try{ const raw = localStorage.getItem(LS_KEY); chats = raw ? JSON.parse(raw) : []; }
  catch(e){ chats = []; }
  if(!Array.isArray(chats)) chats = [];
}
function activeChat(){ return chats.find(c=>c.id===activeId) || null; }
function uid(){ return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ---------- Markdown (escape HTML first) ----------
function renderMarkdown(src){
  let text = esc(src);
  const blocks = [];
  // 1) fenced code blocks -> placeholder
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (m,lang,code)=>{
    blocks.push({lang:lang||'code', code:code.replace(/^\n+|\n+$/g,'')});
    return '\u0000BLOCK'+(blocks.length-1)+'\u0000';
  });
  // 2) inline code -> placeholder
  const inlines = [];
  text = text.replace(/`([^`\n]+)`/g, (m,c)=>{ inlines.push(c); return '\u0000INLINE'+(inlines.length-1)+'\u0000'; });
  // 3) bold
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // 4) lists + paragraphs, line by line
  const lines = text.split('\n');
  let html = '', inUL=false, inOL=false;
  const closeLists = ()=>{ if(inUL){html+='</ul>';inUL=false;} if(inOL){html+='</ol>';inOL=false;} };
  for(const line of lines){
    const ulm = line.match(/^\s*[-*•]\s+(.*)/);
    const olm = line.match(/^\s*\d+[.)]\s+(.*)/);
    if(ulm){ if(!inUL){closeLists();html+='<ul>';inUL=true;} html+='<li>'+ulm[1]+'</li>'; }
    else if(olm){ if(!inOL){closeLists();html+='<ol>';inOL=true;} html+='<li>'+olm[1]+'</li>'; }
    else{ closeLists(); html += line.trim()==='' ? '' : '<p>'+line+'</p>'; }
  }
  closeLists();
  // 5) restore inline code
  html = html.replace(/\u0000INLINE(\d+)\u0000/g, (m,i)=>'<code>'+inlines[+i]+'</code>');
  // 6) restore code blocks with copy button
  html = html.replace(/\u0000BLOCK(\d+)\u0000/g, (m,i)=>{
    const b = blocks[+i];
    return '<pre><div class="code-head"><span>'+esc(b.lang)+'</span>'+
      '<button class="copy-btn" data-codeidx="'+i+'">📋 কপি</button></div>'+
      '<code>'+b.code+'</code></pre>';
  });
  // stash raw code for copy buttons
  pendingCodeBlocks = blocks.map(b=>b.code);
  return html;
}
let pendingCodeBlocks = [];
// decode escaped entities back for copy
function htmlDecode(s){ const t=document.createElement('textarea'); t.innerHTML=s; return t.value; }

// ---------- Sidebar ----------
function renderSidebar(){
  chatList.innerHTML = '';
  const sorted = [...chats].sort((a,b)=>b.createdAt-a.createdAt);
  if(!sorted.length){
    chatList.innerHTML = '<div style="color:var(--muted);font-size:13.5px;padding:12px;text-align:center">এখনো কোনো চ্যাট নেই<br>নতুন চ্যাট শুরু করো ✨</div>';
    return;
  }
  for(const c of sorted){
    const div = document.createElement('div');
    div.className = 'chat-item'+(c.id===activeId?' active':'');
    const t = document.createElement('span'); t.className='title'; t.textContent = c.title || 'নতুন চ্যাট';
    const del = document.createElement('button'); del.className='del'; del.textContent='✕'; del.title='ডিলিট';
    del.onclick = e=>{ e.stopPropagation(); deleteChat(c.id); };
    t.ondblclick = e=>{ e.stopPropagation(); startRename(c.id, t); };
    div.append(t, del);
    div.onclick = ()=>{ switchChat(c.id); closeDrawer(); };
    chatList.appendChild(div);
  }
}
function startRename(id, titleEl){
  const c = chats.find(x=>x.id===id); if(!c) return;
  const inp = document.createElement('input');
  inp.value = c.title || '';
  inp.onclick = e=>e.stopPropagation();
  inp.onkeydown = e=>{
    if(e.key==='Enter'){ c.title = inp.value.trim()||c.title; saveChats(); renderSidebar(); }
    if(e.key==='Escape'){ renderSidebar(); }
    e.stopPropagation();
  };
  inp.onblur = ()=>renderSidebar();
  titleEl.replaceWith(inp); inp.focus(); inp.select();
}
function newChat(){
  const c = { id:uid(), title:'নতুন চ্যাট', messages:[], createdAt:Date.now() };
  chats.push(c); activeId = c.id; saveChats(); renderSidebar(); renderMessages();
  userInput.focus(); closeDrawer();
}
function switchChat(id){ activeId = id; renderSidebar(); renderMessages(); }
function deleteChat(id){
  chats = chats.filter(c=>c.id!==id);
  if(activeId===id) activeId = chats.length ? [...chats].sort((a,b)=>b.createdAt-a.createdAt)[0].id : null;
  saveChats(); renderSidebar(); renderMessages();
}
function clearActiveChat(){
  const c = activeChat(); if(!c) return;
  c.messages = []; saveChats(); renderMessages();
}

// ---------- Messages ----------
function renderMessages(){
  const c = activeChat();
  const has = c && c.messages.length>0;
  welcome.classList.toggle('hidden', !!has);
  messages.classList.toggle('hidden', !has);
  messages.innerHTML = '';
  if(!has) return;
  for(const m of c.messages) appendBubble(m.role, m.text, false);
  messages.scrollTop = messages.scrollHeight;
}
function appendBubble(role, text, animate=true){
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap '+role;
  const av = document.createElement('div');
  av.className = 'avatar '+(role==='ai'?'ai':'you');
  av.textContent = role==='ai' ? 'S' : 'তু';
  const bub = document.createElement('div'); bub.className='bubble';
  if(role==='ai'){
    bub.innerHTML = renderMarkdown(text);
    wireCodeButtons(bub);
    const acts = document.createElement('div'); acts.className='msg-actions';
    const cp = document.createElement('button'); cp.className='mini-btn'; cp.textContent='📋 কপি';
    cp.onclick = ()=>{ navigator.clipboard.writeText(text).then(()=>{cp.textContent='✅ কপি হয়েছে';setTimeout(()=>cp.textContent='📋 কপি',1500);}); };
    const sp = document.createElement('button'); sp.className='mini-btn'; sp.textContent='🔈 শোনো';
    sp.onclick = ()=>{ speak(text, sp); };
    acts.append(cp,sp); bub.appendChild(acts);
  } else {
    bub.textContent = text;
  }
  wrap.append(av,bub); messages.appendChild(wrap);
  if(animate) messages.scrollTop = messages.scrollHeight;
  return bub;
}
function wireCodeButtons(root){
  root.querySelectorAll('.copy-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = +btn.getAttribute('data-codeidx');
      const raw = htmlDecode(pendingCodeBlocks[idx]||'');
      navigator.clipboard.writeText(raw).then(()=>{
        btn.textContent='✅ কপি হয়েছে'; setTimeout(()=>btn.textContent='📋 কপি',1500);
      });
    };
  });
}
function showTyping(){
  const wrap = document.createElement('div');
  wrap.className='msg-wrap ai'; wrap.id='typingRow';
  wrap.innerHTML = '<div class="avatar ai">S</div><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
  messages.appendChild(wrap); messages.scrollTop = messages.scrollHeight;
}
function hideTyping(){ const t=$('typingRow'); if(t) t.remove(); }

// ---------- AI backend ----------
async function fetchWithTimeout(url, ms){
  aborter = new AbortController();
  const timer = setTimeout(()=>aborter.abort(), ms);
  try{
    const res = await fetch(url, { signal: aborter.signal });
    clearTimeout(timer);
    return res;
  }catch(e){ clearTimeout(timer); throw e; }
}
async function askAI(question){
  // Single backend: the user's own SAGOR API. No fallbacks.
  try{
    const r = await fetchWithTimeout(API_PRIMARY + encodeURIComponent(question), TIMEOUT_MS);
    if(!r.ok) throw new Error('api http '+r.status);
    const j = await r.json();
    if(j && (j.reply || j.answer || j.text)) return j.reply || j.answer || j.text;
    throw new Error('api bad payload');
  }catch(e){
    return null; // caller shows the friendly Bengali error
  }
}

// ---------- Send flow ----------
async function sendMessage(text){
  text = (text||'').trim();
  if(!text || typing) return;
  let c = activeChat();
  if(!c){ newChat(); c = activeChat(); }
  if(!c.messages.length) c.title = text.slice(0,34) + (text.length>34?'…':'');
  c.messages.push({role:'user', text, ts:Date.now()});
  saveChats(); renderSidebar(); renderMessages();
  userInput.value=''; autoresize();

  typing = true; stopTyping = false;
  sendBtn.disabled = true; stopRow.classList.add('show');
  showTyping();
  const reply = await askAI(text);
  hideTyping();

  const finalText = stopTyping ? null :
    (reply || '😅 সার্ভার ব্যস্ত, একটু পরে আবার চেষ্টা করো।');

  if(finalText !== null){
    // typewriter effect
    const bub = appendBubble('ai', '', true);
    const acts = document.createElement('div'); acts.className='msg-actions';
    bub.innerHTML = ''; bub.appendChild(acts);
    let i = 0;
    const step = Math.max(1, Math.floor(finalText.length/160));
    await new Promise(res=>{
      const tick = ()=>{
        if(stopTyping){ res(); return; }
        i = Math.min(finalText.length, i+step);
        const partial = finalText.slice(0,i);
        // render markdown of partial (without action buttons until done)
        const tmp = document.createElement('div');
        tmp.innerHTML = renderMarkdown(partial);
        bub.innerHTML = tmp.innerHTML; bub.appendChild(acts); wireCodeButtons(bub);
        messages.scrollTop = messages.scrollHeight;
        if(i < finalText.length) setTimeout(tick, 14);
        else res();
      };
      tick();
    });
    // final render with copy/speak buttons
    bub.innerHTML = renderMarkdown(finalText); wireCodeButtons(bub);
    const acts2 = document.createElement('div'); acts2.className='msg-actions';
    const cp = document.createElement('button'); cp.className='mini-btn'; cp.textContent='📋 কপি';
    cp.onclick = ()=>{ navigator.clipboard.writeText(finalText).then(()=>{cp.textContent='✅ কপি হয়েছে';setTimeout(()=>cp.textContent='📋 কপি',1500);}); };
    const sp = document.createElement('button'); sp.className='mini-btn'; sp.textContent='🔈 শোনো';
    sp.onclick = ()=>{ speak(finalText, sp); };
    acts2.append(cp,sp); bub.appendChild(acts2);

    c.messages.push({role:'ai', text:finalText, ts:Date.now()});
    saveChats(); renderSidebar();
    if(speakOn) speak(finalText, null);
  } else {
    c.messages.push({role:'ai', text:'⏹ থামানো হয়েছে।', ts:Date.now()});
    saveChats(); renderMessages();
  }
  typing = false; sendBtn.disabled = false; stopRow.classList.remove('show');
  messages.scrollTop = messages.scrollHeight;
}

// ---------- Speech (output) ----------
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  return vs.find(v=>v.lang==='bn-BD') || vs.find(v=>v.lang && v.lang.startsWith('bn')) ||
         vs.find(v=>v.lang==='en-US') || vs[0] || null;
}
function speak(text, btn){
  try{
    speechSynthesis.cancel();
    if(btn && btn.classList.contains('speaking')){ btn.classList.remove('speaking'); btn.textContent='🔈 শোনো'; return; }
    const u = new SpeechSynthesisUtterance(text.replace(/[*_`#]/g,''));
    const v = pickVoice(); if(v) u.voice = v;
    u.lang = (v && v.lang) || 'bn-BD'; u.rate = 1;
    if(btn){ btn.classList.add('speaking'); btn.textContent='⏸ থামাও';
      u.onend = u.onerror = ()=>{ btn.classList.remove('speaking'); btn.textContent='🔈 শোনো'; }; }
    speechSynthesis.speak(u);
  }catch(e){}
}
if('speechSynthesis' in window){ speechSynthesis.getVoices(); }

// ---------- Voice input ----------
let recog = null, listening = false;
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('তোমার ব্রাউজারে ভয়েস সাপোর্ট নেই 😅'); return; }
  if(listening){ recog.stop(); return; }
  recog = new SR(); recog.lang='bn-BD'; recog.interimResults=false;
  recog.onstart = ()=>{ listening=true; $('micBtn').classList.add('listening'); };
  recog.onend = ()=>{ listening=false; $('micBtn').classList.remove('listening'); };
  recog.onerror = ()=>{ listening=false; $('micBtn').classList.remove('listening'); };
  recog.onresult = e=>{
    const t = e.results[0][0].transcript;
    userInput.value = (userInput.value ? userInput.value+' ' : '') + t;
    autoresize(); userInput.focus();
  };
  try{ recog.start(); }catch(e){}
}

// ---------- Export / Clear ----------
function exportChat(){
  const c = activeChat();
  if(!c || !c.messages.length){ alert('ডাউনলোড করার মতো কোনো চ্যাট নেই'); return; }
  let out = 'SAGOR AI — চ্যাট এক্সপোর্ট\n'+new Date().toLocaleString('bn-BD')+'\n'+'='.repeat(30)+'\n\n';
  for(const m of c.messages){
    out += (m.role==='user' ? '🧑 তুমি' : '🤖 SAGOR AI') + ':\n' + m.text + '\n\n';
  }
  const blob = new Blob([out], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sagor-ai-chat.txt'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

// ---------- UI wiring ----------
function autoresize(){ userInput.style.height='auto'; userInput.style.height=Math.min(150,userInput.scrollHeight)+'px'; }
function openDrawer(){ sidebar.classList.add('open'); scrim.classList.add('show'); }
function closeDrawer(){ sidebar.classList.remove('open'); scrim.classList.remove('show'); }

$('newChatBtn').onclick = newChat;
$('hamburger').onclick = openDrawer;
scrim.onclick = closeDrawer;
chatForm.addEventListener('submit', e=>{ e.preventDefault(); sendMessage(userInput.value); });
userInput.addEventListener('input', autoresize);
userInput.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(userInput.value); }
});
$('micBtn').onclick = toggleMic;
$('stopBtn').onclick = ()=>{ stopTyping = true; if(aborter) aborter.abort(); };
document.querySelectorAll('.pcard').forEach(b=>{ b.onclick = ()=>sendMessage(b.dataset.q); });
$('clearBtn').onclick = ()=>{
  const c = activeChat();
  if(!c || !c.messages.length) return;
  if(confirm('এই চ্যাটের সব মেসেজ মুছে ফেলবো?')) clearActiveChat();
};
$('exportBtn').onclick = exportChat;
const speakToggle = $('speakToggle');
function paintSpeak(){ speakToggle.classList.toggle('on', speakOn); }
speakToggle.onclick = ()=>{
  speakOn = !speakOn;
  localStorage.setItem(LS_SPEAK, speakOn?'1':'0');
  paintSpeak();
  if(!speakOn && 'speechSynthesis' in window) speechSynthesis.cancel();
};
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });

// ---------- Init ----------
loadChats();
if(!activeId && chats.length){
  activeId = [...chats].sort((a,b)=>b.createdAt-a.createdAt)[0].id;
}
paintSpeak();
renderSidebar();
renderMessages();
autoresize();
</script>
